<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Fuera de servicio - Listado de Interno</title>
<style>
    :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #068a3f;
        --primary-dark: #046b30;
        --danger: #b91c1c;
        --danger-bg: #fef2f2;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        width: 100%;
        max-width: 560px;
        background: var(--surface);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        text-align: center;
    }

    .card-header {
        background: var(--primary);
        color: #fff;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    .card-body {
        padding: 32px 28px 30px;
    }

    .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: var(--danger-bg);
        border: 2px solid var(--danger);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .icon svg {
        width: 36px;
        height: 36px;
        fill: var(--danger);
    }

    h1 {
        margin: 0 0 14px;
        font-size: 30px;
        color: var(--danger);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    p {
        margin: 0 0 12px;
        font-size: 17px;
        line-height: 1.5;
    }

    .highlight {
        margin: 20px 0;
        padding: 14px 16px;
        border: 1px solid #8dd9ad;
        background: #ebf9f1;
        border-radius: 10px;
        color: #064e2a;
        font-weight: 600;
    }

    .signature {
        margin-top: 22px;
        color: var(--muted);
        font-size: 16px;
    }

    @media (max-width: 480px) {
        h1 {
            font-size: 24px;
        }

        p {
            font-size: 16px;
        }

        .card-body {
            padding: 26px 18px 24px;
        }
    }
</style>
</head>
<body>
<main class="card" role="alert">
    <div class="card-header">Listado de Internos</div>
    <div class="card-body">
        <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
                <path d="M12 2 1 21h22L12 2Zm0 4.2L19.5 19h-15L12 6.2ZM11 10v5h2v-5h-2Zm0 6v2h2v-2h-2Z"></path>
            </svg>
        </div>

        <h1>Fuera de servicio</h1>

        <p>Esta página ya no se encuentra disponible.</p>

        <p class="highlight">
            Debe recurrir a la nueva página.<br>
            Solicite el acceso al área de Sistemas.
        </p>

        <p class="signature">Saludos.</p>
    </div>
</main>
</body>
</html>
